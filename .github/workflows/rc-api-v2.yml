name: RC API v2 contracts

on:
  push:
    branches: [feat/rc-api-v2]
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.proto"
      - "**/*.cmake"
      - "**/CMakeLists.txt"
      - "**/*.ui"
      - "**/*.yaml"
      - "robot.cfg.in"
      - "AmurCore.cfg.in"
      - ".github/workflows/rc-api-v2.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protobuf-compatibility:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this feature branch
        uses: actions/checkout@v4
      - name: Checkout peer contract
        uses: actions/checkout@v4
        with:
          repository: ARDev1161/rc_agent
          ref: feat/rc-api-v2
          path: contract-peer
          persist-credentials: false
      - name: Check mirrored protocol files
        shell: bash
        run: |
          set -euo pipefail
          cmp network/protobuf/rc_api_v2.proto contract-peer/network/protobuf/rc_api_v2.proto
          cmp network/protobuf/robot.proto contract-peer/network/protobuf/robot.proto
          echo "Mirrored protobuf contracts match"
      - name: Install protobuf compiler + C++ library
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev python3-protobuf g++
      - name: Generate all Protobuf C++ and Python types
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          protoc --experimental_allow_proto3_optional -I network/protobuf --python_out=generated --cpp_out=generated network/protobuf/*.proto
      - name: Run Python wire-contract tests
        env:
          PYTHONPATH: generated
        run: /usr/bin/python3 -m unittest discover -s tests -p test_proto_contract.py -v
      - name: Checkout legacy dev wire contract
        uses: actions/checkout@v4
        with:
          ref: dev
          path: legacy-source
          persist-credentials: false
      - name: Generate legacy Python protocol and verify real old/new wire interoperability
        env:
          PYTHONPATH: generated
          LEGACY_PROTO_PY: legacy-generated
        run: |
          set -euo pipefail
          mkdir -p legacy-generated
          protoc --experimental_allow_proto3_optional -I legacy-source/network/protobuf \
            --python_out=legacy-generated legacy-source/network/protobuf/*.proto
          /usr/bin/python3 -m unittest discover -s tests -p test_legacy_wire_interop.py -v
      - name: Compile and run C++ legacy/v2 roundtrip
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O0 -I generated generated/*.pb.cc tests/proto_cpp_smoke.cpp -lprotobuf -pthread -o generated/protocol_smoke
          ./generated/protocol_smoke
  qt-app-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt5, OpenCV, SDL2, libconfig++, protobuf and gRPC
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config qtbase5-dev qttools5-dev qttools5-dev-tools \
            libopencv-dev libsdl2-dev libconfig++-dev libgrpc++-dev protobuf-compiler \
            protobuf-compiler-grpc libprotobuf-dev
      - name: Configure with system gRPC
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGRPC_FETCHCONTENT=OFF -DBUILD_APPIMAGE=OFF -DRC_API_V2_TESTING=ON
      - name: Compile AmurCore and Qt UI
        run: cmake --build build-ci --parallel 2
      - name: Run real loopback gRPC transport regression
        run: ctest --test-dir build-ci --output-on-failure -R rc_api_v2_transport

